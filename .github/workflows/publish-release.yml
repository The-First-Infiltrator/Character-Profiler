# SPDX-License-Identifier: GPL-3.0-or-later

name: Publish requested releases

on:
  push:
    branches: [ main ]
    paths:
      - '.github/release-requests/*.json'

permissions:
  contents: write

concurrency:
  group: character-profiler-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 2

      - name: Resolve newly-added release request
        shell: bash
        run: |
          set -euo pipefail

          before='${{ github.event.before }}'
          if [[ -z "$before" || "$before" == '0000000000000000000000000000000000000000' ]]; then
            echo 'A normal main-branch parent commit is required for release publication.' >&2
            exit 1
          fi

          requests="$(git diff --diff-filter=A --name-only "$before" "$GITHUB_SHA" -- '.github/release-requests/*.json')"
          count="$(printf '%s\n' "$requests" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$count" != '1' ]]; then
            echo "Expected exactly one newly-added release request, found $count." >&2
            printf '%s\n' "$requests" >&2
            exit 1
          fi

          request="$(printf '%s\n' "$requests" | sed '/^$/d')"
          tag="$(jq -er '.tag | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$"))' "$request")"
          target="$(jq -r '.target // "current-main"' "$request")"
          if [[ "$target" != 'current-main' && "$target" != "$GITHUB_SHA" ]]; then
            echo "$request targets $target, but this release workflow publishes only the exact main commit $GITHUB_SHA." >&2
            exit 1
          fi

          title="$(jq -r '.title // .tag' "$request")"
          draft="$(jq -r '.draft // false' "$request")"
          prerelease="$(jq -r '.prerelease // false' "$request")"
          version="${tag#v}"

          jq -r '.notes // ""' "$request" > "$RUNNER_TEMP/release-notes.md"

          {
            echo "RELEASE_REQUEST=$request"
            echo "RELEASE_TAG=$tag"
            echo "RELEASE_VERSION=$version"
            echo "RELEASE_DRAFT=$draft"
            echo "RELEASE_PRERELEASE=$prerelease"
            echo 'RELEASE_TITLE<<CHARACTER_PROFILER_EOF'
            printf '%s\n' "$title"
            echo 'CHARACTER_PROFILER_EOF'
          } >> "$GITHUB_ENV"

      - name: Verify pinned Xcode and release version
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          grep -q '^Xcode 16\.4$' <<<"$xcode_version"

          project_version="$(xcodebuild -project CharacterProfiler.xcodeproj -scheme CharacterProfiler -configuration Release -showBuildSettings | awk '/MARKETING_VERSION =/ {print $3; exit}')"
          if [[ "$project_version" != "$RELEASE_VERSION" ]]; then
            echo "Release request version $RELEASE_VERSION does not match MARKETING_VERSION $project_version." >&2
            exit 1
          fi

      - name: Validate application resources
        shell: bash
        run: |
          set -euo pipefail
          icon='CharacterProfiler/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png'
          manifest='CharacterProfiler/Assets.xcassets/AppIcon.appiconset/Contents.json'
          test -s "$icon"
          test -s "$manifest"
          width="$(sips -g pixelWidth "$icon" | awk '/pixelWidth/ {print $2}')"
          height="$(sips -g pixelHeight "$icon" | awk '/pixelHeight/ {print $2}')"
          alpha="$(sips -g hasAlpha "$icon" | awk '/hasAlpha/ {print $2}')"
          [[ "$width" == '1024' && "$height" == '1024' ]]
          [[ "$alpha" == 'no' ]]

      - name: Prepare iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available > "$RUNNER_TEMP/available-simulators.txt" || true
          simulator_id="$(grep -m1 -E 'iPhone .*[0-9A-Fa-f-]{36}' "$RUNNER_TEMP/available-simulators.txt" | grep -oE '[0-9A-Fa-f-]{36}' | head -1 || true)"
          if [[ -z "$simulator_id" ]]; then
            xcodebuild -downloadPlatform iOS
            xcrun simctl list devices available > "$RUNNER_TEMP/available-simulators.txt"
            simulator_id="$(grep -m1 -E 'iPhone .*[0-9A-Fa-f-]{36}' "$RUNNER_TEMP/available-simulators.txt" | grep -oE '[0-9A-Fa-f-]{36}' | head -1 || true)"
          fi
          if [[ -z "$simulator_id" ]]; then
            echo 'No bootable iPhone simulator is available.' >&2
            exit 1
          fi
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Test exact release commit
        run: >-
          xcodebuild
          -project CharacterProfiler.xcodeproj
          -scheme CharacterProfiler
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=${SIMULATOR_ID}"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          test

      - name: Build optimized Simulator Release
        run: >-
          xcodebuild
          -project CharacterProfiler.xcodeproj
          -scheme CharacterProfiler
          -configuration Release
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=${SIMULATOR_ID}"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          build

      - name: Build optimized iPhoneOS Release
        run: >-
          xcodebuild
          -project CharacterProfiler.xcodeproj
          -scheme CharacterProfiler
          -configuration Release
          -sdk iphoneos
          -destination "generic/platform=iOS"
          -derivedDataPath "$RUNNER_TEMP/CharacterProfilerReleaseDerivedData"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/CharacterProfilerReleaseDerivedData/Build/Products/Release-iphoneos/CharacterProfiler.app"
          test -d "$app"

          package="$RUNNER_TEMP/CharacterProfiler-release-package"
          rm -rf "$package"
          mkdir -p "$package/Payload" "$GITHUB_WORKSPACE/release-assets"
          ditto "$app" "$package/Payload/CharacterProfiler.app"
          (
            cd "$package"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa" Payload
          )

          test -s "$GITHUB_WORKSPACE/release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa" > "$GITHUB_WORKSPACE/release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa.sha256"
          cat "$GITHUB_WORKSPACE/release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa.sha256"

      - name: Publish GitHub Release with IPA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          existing_tag="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$existing_tag" && "$existing_tag" != "$GITHUB_SHA" ]]; then
            echo "$RELEASE_TAG already points to $existing_tag instead of $GITHUB_SHA." >&2
            exit 1
          fi

          ipa="release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa"
          checksum="${ipa}.sha256"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ipa" "$checksum" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/release-notes.md" --repo "$GITHUB_REPOSITORY"
          else
            args=(release create "$RELEASE_TAG" "$ipa" "$checksum" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/release-notes.md" --repo "$GITHUB_REPOSITORY")
            if [[ "$RELEASE_DRAFT" == 'true' ]]; then
              args+=(--draft)
            fi
            if [[ "$RELEASE_PRERELEASE" == 'true' ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi

          echo "Published $RELEASE_TAG from exact commit $GITHUB_SHA with IPA asset $ipa."
