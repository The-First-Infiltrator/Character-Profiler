name: Publish requested releases

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-requests/*.json'
      - '.github/scripts/publish-release.js'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Syntax-check publisher
        run: node --check .github/scripts/publish-release.js

      - name: Publish validated release requests
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const publish = require('./.github/scripts/publish-release.js');
            await publish({ github, context, core });
