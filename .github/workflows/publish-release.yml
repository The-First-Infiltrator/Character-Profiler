# SPDX-License-Identifier: GPL-3.0-or-later

name: Publish requested releases

on:
  push:
    branches: [ main ]
    paths:
      - '.github/release-requests/*.json'

permissions:
  contents: write

concurrency:
  group: character-profiler-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 2

      - name: Resolve newly-added release request
        shell: bash
        run: |
          set -euo pipefail

          before='${{ github.event.before }}'
          if [[ -z "$before" || "$before" == '0000000000000000000000000000000000000000' ]]; then
            echo 'A normal main-branch parent commit is required for release publication.' >&2
            exit 1
          fi

          requests="$(git diff --diff-filter=A --name-only "$before" "$GITHUB_SHA" -- '.github/release-requests/*.json')"
          count="$(printf '%s\n' "$requests" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$count" != '1' ]]; then
            echo "Expected exactly one newly-added release request, found $count." >&2
            printf '%s\n' "$requests" >&2
            exit 1
          fi

          request="$(printf '%s\n' "$requests" | sed '/^$/d')"
          tag="$(jq -er '.tag | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$"))' "$request")"
          target="$(jq -r '.target // "current-main"' "$request")"
          if [[ "$target" != 'current-main' && "$target" != "$GITHUB_SHA" ]]; then
            echo "$request targets $target, but this release workflow publishes only the exact main commit $GITHUB_SHA." >&2
            exit 1
          fi

          title="$(jq -r '.title // .tag' "$request")"
          draft="$(jq -r '.draft // false' "$request")"
          prerelease="$(jq -r '.prerelease // false' "$request")"
          version="${tag#v}"
          base_version="$(printf '%s\n' "$version" | sed -E 's/[-+].*$//')"

          jq -r '.notes // ""' "$request" > "$RUNNER_TEMP/release-notes.md"

          {
            echo "RELEASE_REQUEST=$request"
            echo "RELEASE_TAG=$tag"
            echo "RELEASE_VERSION=$version"
            echo "RELEASE_BASE_VERSION=$base_version"
            echo "RELEASE_DRAFT=$draft"
            echo "RELEASE_PRERELEASE=$prerelease"
            echo 'RELEASE_TITLE<<CHARACTER_PROFILER_EOF'
            printf '%s\n' "$title"
            echo 'CHARACTER_PROFILER_EOF'
          } >> "$GITHUB_ENV"

      - name: Verify pinned Xcode and release version
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          grep -q '^Xcode 16\.4$' <<<"$xcode_version"

          project_version="$(xcodebuild -project CharacterProfiler.xcodeproj -scheme CharacterProfiler -configuration Release -showBuildSettings | awk '/MARKETING_VERSION =/ {print $3; exit}')"
          if [[ "$project_version" != "$RELEASE_BASE_VERSION" ]]; then
            echo "Release request base version $RELEASE_BASE_VERSION does not match MARKETING_VERSION $project_version." >&2
            exit 1
          fi

          project_build="$(xcodebuild -project CharacterProfiler.xcodeproj -scheme CharacterProfiler -configuration Release -showBuildSettings | awk '/CURRENT_PROJECT_VERSION =/ {print $3; exit}')"
          if ! [[ "$project_build" =~ ^[1-9][0-9]*$ ]]; then
            echo "CURRENT_PROJECT_VERSION must be a positive integer, found $project_build." >&2
            exit 1
          fi
          echo "RELEASE_BUILD=$project_build" >> "$GITHUB_ENV"

      - name: Validate application resources
        shell: bash
        run: |
          set -euo pipefail
          icon='CharacterProfiler/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png'
          manifest='CharacterProfiler/Assets.xcassets/AppIcon.appiconset/Contents.json'
          test -s "$icon"
          test -s "$manifest"
          width="$(sips -g pixelWidth "$icon" | awk '/pixelWidth/ {print $2}')"
          height="$(sips -g pixelHeight "$icon" | awk '/pixelHeight/ {print $2}')"
          alpha="$(sips -g hasAlpha "$icon" | awk '/hasAlpha/ {print $2}')"
          [[ "$width" == '1024' && "$height" == '1024' ]]
          [[ "$alpha" == 'no' ]]

      - name: Prepare iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available > "$RUNNER_TEMP/available-simulators.txt" || true
          simulator_id="$(grep -m1 -E 'iPhone .*[0-9A-Fa-f-]{36}' "$RUNNER_TEMP/available-simulators.txt" | grep -oE '[0-9A-Fa-f-]{36}' | head -1 || true)"
          if [[ -z "$simulator_id" ]]; then
            xcodebuild -downloadPlatform iOS
            xcrun simctl list devices available > "$RUNNER_TEMP/available-simulators.txt"
            simulator_id="$(grep -m1 -E 'iPhone .*[0-9A-Fa-f-]{36}' "$RUNNER_TEMP/available-simulators.txt" | grep -oE '[0-9A-Fa-f-]{36}' | head -1 || true)"
          fi
          if [[ -z "$simulator_id" ]]; then
            echo 'No bootable iPhone simulator is available.' >&2
            exit 1
          fi
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Test exact release commit
        run: >-
          xcodebuild
          -project CharacterProfiler.xcodeproj
          -scheme CharacterProfiler
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=${SIMULATOR_ID}"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          test

      - name: Build optimized Simulator Release
        run: >-
          xcodebuild
          -project CharacterProfiler.xcodeproj
          -scheme CharacterProfiler
          -configuration Release
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=${SIMULATOR_ID}"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          build

      - name: Build optimized iPhoneOS Release
        run: >-
          xcodebuild
          -project CharacterProfiler.xcodeproj
          -scheme CharacterProfiler
          -configuration Release
          -sdk iphoneos
          -destination "generic/platform=iOS"
          -derivedDataPath "$RUNNER_TEMP/CharacterProfilerReleaseDerivedData"
          MARKETING_VERSION="$RELEASE_BASE_VERSION"
          CURRENT_PROJECT_VERSION="$RELEASE_BUILD"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/CharacterProfilerReleaseDerivedData/Build/Products/Release-iphoneos/CharacterProfiler.app"
          test -d "$app"

          package="$RUNNER_TEMP/CharacterProfiler-release-package"
          rm -rf "$package"
          mkdir -p "$package/Payload" "$GITHUB_WORKSPACE/release-assets"
          ditto "$app" "$package/Payload/CharacterProfiler.app"
          (
            cd "$package"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa" Payload
          )

          test -s "$GITHUB_WORKSPACE/release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa" > "$GITHUB_WORKSPACE/release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa.sha256"
          cat "$GITHUB_WORKSPACE/release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa.sha256"

      - name: Retain release IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CharacterProfiler-release-${{ github.sha }}
          path: |
            release-assets/*.ipa
            release-assets/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish and verify GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Accept: application/vnd.github+json')
          response="$RUNNER_TEMP/release.json"

          http="$(curl -sS -o "$response" -w '%{http_code}' "${auth[@]}" "$api/releases/tags/$RELEASE_TAG")"
          if [[ "$http" == '200' ]]; then
            release_id="$(jq -er '.id' "$response")"
            curl -fsS -X PATCH "${auth[@]}" "$api/releases/$release_id" \
              -d "$(jq -n --arg name "$RELEASE_TITLE" --rawfile body "$RUNNER_TEMP/release-notes.md" --argjson draft "$RELEASE_DRAFT" --argjson prerelease "$RELEASE_PRERELEASE" '{name:$name,body:$body,draft:$draft,prerelease:$prerelease}')" \
              > "$response"
          elif [[ "$http" == '404' ]]; then
            curl -fsS -X POST "${auth[@]}" "$api/releases" \
              -d "$(jq -n --arg tag "$RELEASE_TAG" --arg target "$GITHUB_SHA" --arg name "$RELEASE_TITLE" --rawfile body "$RUNNER_TEMP/release-notes.md" --argjson draft "$RELEASE_DRAFT" --argjson prerelease "$RELEASE_PRERELEASE" '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:$draft,prerelease:$prerelease}')" \
              > "$response"
            release_id="$(jq -er '.id' "$response")"
          else
            cat "$response" >&2
            echo "Unexpected release lookup HTTP status $http." >&2
            exit 1
          fi

          tag_json="$RUNNER_TEMP/tag.json"
          curl -fsS "${auth[@]}" "$api/git/ref/tags/$RELEASE_TAG" > "$tag_json"
          tag_target="$(jq -er '.object.sha' "$tag_json")"
          if [[ "$tag_target" != "$GITHUB_SHA" ]]; then
            echo "$RELEASE_TAG points to $tag_target, expected $GITHUB_SHA." >&2
            exit 1
          fi

          for asset in \
            "release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa" \
            "release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa.sha256"
          do
            name="$(basename "$asset")"
            existing_id="$(curl -fsS "${auth[@]}" "$api/releases/$release_id/assets?per_page=100" | jq -r --arg name "$name" '.[] | select(.name == $name) | .id' | head -1)"
            if [[ -n "$existing_id" ]]; then
              curl -fsS -X DELETE "${auth[@]}" "$api/releases/assets/$existing_id" >/dev/null
            fi
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Accept: application/vnd.github+json' \
              -H 'Content-Type: application/octet-stream' \
              --data-binary "@$asset" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name" \
              > "$RUNNER_TEMP/upload-$name.json"
            jq -e --arg name "$name" '.name == $name and .state == "uploaded" and .size > 0' "$RUNNER_TEMP/upload-$name.json" >/dev/null
          done

          final="$RUNNER_TEMP/final-release.json"
          curl -fsS "${auth[@]}" "$api/releases/$release_id" > "$final"
          jq -e --arg tag "$RELEASE_TAG" --argjson draft "$RELEASE_DRAFT" --argjson prerelease "$RELEASE_PRERELEASE" '.tag_name == $tag and .draft == $draft and .prerelease == $prerelease' "$final" >/dev/null
          jq -e --arg name "CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa" '[.assets[].name] | index($name) != null' "$final" >/dev/null
          jq -e --arg name "CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa.sha256" '[.assets[].name] | index($name) != null' "$final" >/dev/null
          jq -r '.html_url' "$final"
