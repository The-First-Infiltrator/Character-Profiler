# SPDX-License-Identifier: GPL-3.0-or-later
name: Remove stray UX branch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cleanup-ux-branch-one-shot.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          fetch-depth: 2
      - name: Delete exact stray branch and self-remove
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs/heads/ux/1.1-flow-overhaul"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-ux-branch-one-shot.yml
          git commit -m 'Remove completed UX branch cleanup workflow'
          git push origin HEAD:main
