name: temporary-repository-cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-stale-branches:
    if: github.repository == 'The-First-Infiltrator/Character-Profiler'
    runs-on: ubuntu-24.04
    steps:
      - name: Delete obsolete development refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in interface-flow-polish interface-flow-polish-2 noop-check; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            fi
          done
