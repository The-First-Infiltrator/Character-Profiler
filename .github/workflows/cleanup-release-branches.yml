name: Clean merged release branches

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed interface and release branches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs/heads"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Accept: application/vnd.github+json')

          for branch in \
            interface-polish \
            release-v1.1.0-rc.2 \
            release-v1.1.0-rc.2-verified \
            release-v1.1.0-rc.2-final \
            release-v1.1.0-rc.2-assets \
            cleanup-release-branches
          do
            status="$(curl -sS -o "$RUNNER_TEMP/delete-response.json" -w '%{http_code}' -X DELETE "${auth[@]}" "$api/$branch")"
            if [[ "$status" != '204' && "$status" != '404' ]]; then
              cat "$RUNNER_TEMP/delete-response.json" >&2
              echo "Failed to delete $branch (HTTP $status)." >&2
              exit 1
            fi
          done
