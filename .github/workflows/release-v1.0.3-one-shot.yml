name: Publish Character Profiler 1.0.3

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-v1.0.3-one-shot.yml'

permissions:
  contents: write

concurrency:
  group: character-profiler-release-v1.0.3
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      RELEASE_TAG: v1.0.3
      RELEASE_VERSION: 1.0.3
      RELEASE_BUILD: '14'
    steps:
      - name: Checkout main
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          fetch-depth: 2

      - name: Commit exact 1.0.3 release metadata
        shell: bash
        run: |
          set -euo pipefail
          project='CharacterProfiler.xcodeproj/project.pbxproj'

          python3 - <<'PY'
          from pathlib import Path
          p = Path('CharacterProfiler.xcodeproj/project.pbxproj')
          s = p.read_text()
          old_marketing = 'MARKETING_VERSION = 1.0.2;'
          old_build = 'CURRENT_PROJECT_VERSION = 13;'
          if s.count(old_marketing) != 2:
              raise SystemExit(f'Expected exactly 2 old marketing-version entries, found {s.count(old_marketing)}')
          if s.count(old_build) != 2:
              raise SystemExit(f'Expected exactly 2 old build-number entries, found {s.count(old_build)}')
          s = s.replace(old_marketing, 'MARKETING_VERSION = 1.0.3;')
          s = s.replace(old_build, 'CURRENT_PROJECT_VERSION = 14;')
          p.write_text(s)
          PY

          mkdir -p .github/release-requests
          cat > .github/release-requests/v1.0.3.json <<'JSON'
          {
            "tag": "v1.0.3",
            "target": "current-main",
            "title": "Character Profiler 1.0.3",
            "draft": false,
            "prerelease": false,
            "notes": "Character Profiler 1.0.3 is the app-icon integrity correction release.\n\nThis release fixes the malformed application icon visible in sideloading tools and on physical devices. The canonical 1024×1024 icon is now generated deterministically inside GitHub Actions rather than transported through a binary API path that could corrupt PNG data.\n\nA new permanent App Icon Integrity gate builds the optimized iPhoneOS application, decodes Apple's compiled CgBI AppIcon60x60@2x.png, and compares its actual pixels against the source icon. The release itself repeats that compiled-icon validation before the IPA can be packaged or published.\n\nCharacter and story deletion fixes from 1.0.2 remain included. There is no SwiftData schema or archive-format change; Character Profiler archive format remains v1.\n\nThe release is tested and built with pinned Xcode 16.4 and published as an intentionally unsigned IPA for AltStore, AltServer, Sideloadly, or another sideloading tool to apply the user's development signature during installation."
          }
          JSON

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$project" .github/release-requests/v1.0.3.json
          git commit -m 'Release Character Profiler 1.0.3 (build 14)'
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify committed release metadata and pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          grep -q '^Xcode 16\.4$' <<<"$xcode_version"

          project_version="$(xcodebuild -project CharacterProfiler.xcodeproj -scheme CharacterProfiler -configuration Release -showBuildSettings | awk '/MARKETING_VERSION =/ {print $3; exit}')"
          project_build="$(xcodebuild -project CharacterProfiler.xcodeproj -scheme CharacterProfiler -configuration Release -showBuildSettings | awk '/CURRENT_PROJECT_VERSION =/ {print $3; exit}')"
          [[ "$project_version" == "$RELEASE_VERSION" ]]
          [[ "$project_build" == "$RELEASE_BUILD" ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]

      - name: Validate source application resources
        shell: bash
        run: |
          set -euo pipefail
          icon='CharacterProfiler/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png'
          manifest='CharacterProfiler/Assets.xcassets/AppIcon.appiconset/Contents.json'
          test -s "$icon"
          test -s "$manifest"
          width="$(sips -g pixelWidth "$icon" | awk '/pixelWidth/ {print $2}')"
          height="$(sips -g pixelHeight "$icon" | awk '/pixelHeight/ {print $2}')"
          alpha="$(sips -g hasAlpha "$icon" | awk '/hasAlpha/ {print $2}')"
          [[ "$width" == '1024' && "$height" == '1024' ]]
          [[ "$alpha" == 'no' ]]
          python3 .github/scripts/validate_compiled_icon.py "$icon" "$icon" --max-mean-error 0

      - name: Prepare iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available > "$RUNNER_TEMP/available-simulators.txt" || true
          simulator_id="$(grep -m1 -E 'iPhone .*[0-9A-Fa-f-]{36}' "$RUNNER_TEMP/available-simulators.txt" | grep -oE '[0-9A-Fa-f-]{36}' | head -1 || true)"
          if [[ -z "$simulator_id" ]]; then
            xcodebuild -downloadPlatform iOS
            xcrun simctl list devices available > "$RUNNER_TEMP/available-simulators.txt"
            simulator_id="$(grep -m1 -E 'iPhone .*[0-9A-Fa-f-]{36}' "$RUNNER_TEMP/available-simulators.txt" | grep -oE '[0-9A-Fa-f-]{36}' | head -1 || true)"
          fi
          if [[ -z "$simulator_id" ]]; then
            echo 'No bootable iPhone simulator is available.' >&2
            exit 1
          fi
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Test exact release commit
        run: >-
          xcodebuild
          -project CharacterProfiler.xcodeproj
          -scheme CharacterProfiler
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=${SIMULATOR_ID}"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          test

      - name: Build optimized Simulator Release
        run: >-
          xcodebuild
          -project CharacterProfiler.xcodeproj
          -scheme CharacterProfiler
          -configuration Release
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=${SIMULATOR_ID}"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          build

      - name: Build optimized iPhoneOS Release
        run: >-
          xcodebuild
          -project CharacterProfiler.xcodeproj
          -scheme CharacterProfiler
          -configuration Release
          -sdk iphoneos
          -destination "generic/platform=iOS"
          -derivedDataPath "$RUNNER_TEMP/CharacterProfilerReleaseDerivedData"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          build

      - name: Verify compiled iPhone app icon pixels
        shell: bash
        run: |
          set -euo pipefail
          source_icon='CharacterProfiler/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png'
          app="$RUNNER_TEMP/CharacterProfilerReleaseDerivedData/Build/Products/Release-iphoneos/CharacterProfiler.app"
          compiled_icon="$app/AppIcon60x60@2x.png"
          test -s "$compiled_icon"
          python3 .github/scripts/validate_compiled_icon.py "$source_icon" "$compiled_icon"

      - name: Package unsigned IPA and checksum
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/CharacterProfilerReleaseDerivedData/Build/Products/Release-iphoneos/CharacterProfiler.app"
          test -d "$app"
          package="$RUNNER_TEMP/CharacterProfiler-release-package"
          rm -rf "$package"
          mkdir -p "$package/Payload" "$GITHUB_WORKSPACE/release-assets"
          ditto "$app" "$package/Payload/CharacterProfiler.app"
          (
            cd "$package"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa" Payload
          )
          test -s "$GITHUB_WORKSPACE/release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa" > "$GITHUB_WORKSPACE/release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa.sha256"
          cat "$GITHUB_WORKSPACE/release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa.sha256"

      - name: Retain release IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CharacterProfiler-release-${{ env.RELEASE_SHA }}
          path: |
            release-assets/*.ipa
            release-assets/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish and verify v1.0.3 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Accept: application/vnd.github+json')
          notes='.github/release-requests/v1.0.3.json'
          jq -r '.notes' "$notes" > "$RUNNER_TEMP/release-notes.md"

          lookup="$RUNNER_TEMP/release-lookup.json"
          http="$(curl -sS -o "$lookup" -w '%{http_code}' "${auth[@]}" "$api/releases/tags/$RELEASE_TAG")"
          if [[ "$http" == '200' ]]; then
            release_id="$(jq -er '.id' "$lookup")"
            curl -fsS -X PATCH "${auth[@]}" "$api/releases/$release_id" \
              -d "$(jq -n --arg name 'Character Profiler 1.0.3' --rawfile body "$RUNNER_TEMP/release-notes.md" '{name:$name,body:$body,draft:false,prerelease:false,make_latest:"true"}')" \
              > "$RUNNER_TEMP/release-update.json"
          elif [[ "$http" == '404' ]]; then
            create="$RUNNER_TEMP/release-create.json"
            curl -fsS -X POST "${auth[@]}" "$api/releases" \
              -d "$(jq -n --arg tag "$RELEASE_TAG" --arg target "$RELEASE_SHA" --arg name 'Character Profiler 1.0.3' --rawfile body "$RUNNER_TEMP/release-notes.md" '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:false,make_latest:"true"}')" \
              > "$create"
            release_id="$(jq -er '.id' "$create")"
          else
            cat "$lookup" >&2
            echo "Unexpected release lookup HTTP status $http." >&2
            exit 1
          fi

          tag_json="$RUNNER_TEMP/tag.json"
          curl -fsS "${auth[@]}" "$api/git/ref/tags/$RELEASE_TAG" > "$tag_json"
          tag_target="$(jq -er '.object.sha' "$tag_json")"
          [[ "$tag_target" == "$RELEASE_SHA" ]]

          for asset in \
            "release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa" \
            "release-assets/CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa.sha256"
          do
            name="$(basename "$asset")"
            existing_id="$(curl -fsS "${auth[@]}" "$api/releases/$release_id/assets?per_page=100" | jq -r --arg name "$name" '.[] | select(.name == $name) | .id' | head -1)"
            if [[ -n "$existing_id" ]]; then
              curl -fsS -X DELETE "${auth[@]}" "$api/releases/assets/$existing_id" >/dev/null
            fi
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Accept: application/vnd.github+json' \
              -H 'Content-Type: application/octet-stream' \
              --data-binary "@$asset" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name" \
              > "$RUNNER_TEMP/upload-$name.json"
            jq -e --arg name "$name" '.name == $name and .state == "uploaded" and .size > 0' "$RUNNER_TEMP/upload-$name.json" >/dev/null
          done

          final="$RUNNER_TEMP/final-release.json"
          curl -fsS "${auth[@]}" "$api/releases/$release_id" > "$final"
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false and .prerelease == false' "$final" >/dev/null
          jq -e --arg name "CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa" '[.assets[].name] | index($name) != null' "$final" >/dev/null
          jq -e --arg name "CharacterProfiler-${RELEASE_VERSION}-unsigned.ipa.sha256" '[.assets[].name] | index($name) != null' "$final" >/dev/null
          jq -r '.html_url' "$final"

      - name: Remove one-shot publisher from main
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/release-v1.0.3-one-shot.yml
          git commit -m 'Remove one-shot v1.0.3 release publisher'
          git push origin HEAD:main
