# SPDX-License-Identifier: GPL-3.0-or-later
name: temporary-source-cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Apply guarded source cleanup
        run: python3 .github/scripts/temporary_source_cleanup.py
      - name: Verify and commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -s CharacterProfiler/Views/Character3DHeadWorkspaceView.swift
          ! grep -q '^import RealityKit$' CharacterProfiler/Views/CharacterDetailView.swift
          ! grep -q '^import QuickLook$' CharacterProfiler/Views/CharacterDetailView.swift
          grep -q 'Character3DHeadWorkspaceView.swift in Sources' CharacterProfiler.xcodeproj/project.pbxproj
          grep -q '^struct Character3DHeadWorkspaceView: View' CharacterProfiler/Views/Character3DHeadWorkspaceView.swift
          git diff --check
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --quiet && { echo 'No cleanup changes produced.' >&2; exit 1; }
          git commit -m 'Split 3D workspace and document model invariants'
          git push origin HEAD:main
