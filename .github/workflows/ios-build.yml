name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ios-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Validate application resources
        shell: bash
        run: |
          set -euo pipefail
          icon="CharacterProfiler/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          manifest="CharacterProfiler/Assets.xcassets/AppIcon.appiconset/Contents.json"

          test -s "$icon"
          test -s "$manifest"
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("CharacterProfiler/Assets.xcassets/AppIcon.appiconset/Contents.json").read_text())
          images = manifest.get("images", [])
          assert any(item.get("filename") == "AppIcon-1024.png" and item.get("size") == "1024x1024" for item in images)
          PY

          width="$(sips -g pixelWidth "$icon" | awk '/pixelWidth/ {print $2}')"
          height="$(sips -g pixelHeight "$icon" | awk '/pixelHeight/ {print $2}')"
          alpha="$(sips -g hasAlpha "$icon" | awk '/hasAlpha/ {print $2}')"
          [[ "$width" == "1024" && "$height" == "1024" ]]
          [[ "$alpha" == "no" ]]

      - name: Verify pinned Xcode version
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          grep -q '^Xcode 16\.4$' <<<"$version"

      - name: Prepare iOS Simulator
        shell: bash
        run: |
          set -euo pipefail

          xcrun simctl list devices available >/tmp/available-simulators.txt || true
          cat /tmp/available-simulators.txt

          simulator_id="$(grep -m1 -E 'iPhone .*[0-9A-Fa-f-]{36}' /tmp/available-simulators.txt | grep -oE '[0-9A-Fa-f-]{36}' | head -1 || true)"

          if [[ -z "$simulator_id" ]]; then
            echo "No bootable iPhone simulator is currently installed; downloading the default iOS runtime for the pinned Xcode."
            xcodebuild -downloadPlatform iOS
            xcrun simctl list devices available >/tmp/available-simulators.txt
            cat /tmp/available-simulators.txt
            simulator_id="$(grep -m1 -E 'iPhone .*[0-9A-Fa-f-]{36}' /tmp/available-simulators.txt | grep -oE '[0-9A-Fa-f-]{36}' | head -1 || true)"
          fi

          if [[ -z "$simulator_id" ]]; then
            echo "No bootable iPhone simulator is available after runtime preparation." >&2
            exit 1
          fi

          echo "Using simulator $simulator_id"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Test on iOS Simulator
        run: >-
          xcodebuild
          -project CharacterProfiler.xcodeproj
          -scheme CharacterProfiler
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=${SIMULATOR_ID}"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          test

      - name: Build optimized Simulator Release
        run: >-
          xcodebuild
          -project CharacterProfiler.xcodeproj
          -scheme CharacterProfiler
          -configuration Release
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=${SIMULATOR_ID}"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          build

      - name: Build optimized iPhoneOS Release
        run: >-
          xcodebuild
          -project CharacterProfiler.xcodeproj
          -scheme CharacterProfiler
          -configuration Release
          -sdk iphoneos
          -destination "generic/platform=iOS"
          -derivedDataPath "$RUNNER_TEMP/CharacterProfilerDerivedData"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          app="$RUNNER_TEMP/CharacterProfilerDerivedData/Build/Products/Release-iphoneos/CharacterProfiler.app"
          test -d "$app"

          version="$(xcodebuild -project CharacterProfiler.xcodeproj -scheme CharacterProfiler -configuration Release -showBuildSettings | awk '/MARKETING_VERSION =/ {print $3; exit}')"
          test -n "$version"

          package="$RUNNER_TEMP/CharacterProfiler-package"
          output="$GITHUB_WORKSPACE/artifacts"
          rm -rf "$package" "$output"
          mkdir -p "$package/Payload" "$output"
          ditto "$app" "$package/Payload/CharacterProfiler.app"
          (
            cd "$package"
            /usr/bin/zip -qry "$output/CharacterProfiler-${version}-unsigned.ipa" Payload
          )

          test -s "$output/CharacterProfiler-${version}-unsigned.ipa"
          shasum -a 256 "$output/CharacterProfiler-${version}-unsigned.ipa" | tee "$output/CharacterProfiler-${version}-unsigned.ipa.sha256"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CharacterProfiler-IPA-${{ github.sha }}
          path: |
            artifacts/*.ipa
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 30
